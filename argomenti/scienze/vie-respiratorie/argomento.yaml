titolo: Le vie respiratorie
sottotitolo: Il viaggio dell'aria dal naso agli alveoli
materia: scienze
area: anatomia
modello: passaggi
durata_minuti: 12
prerequisiti: []
obiettivi:
  - Elencare in ordine gli organi delle vie respiratorie, dal naso agli alveoli
  - Spiegare come il naso filtra, scalda e inumidisce l'aria
  - Descrivere la trachea, i bronchi e i bronchioli
  - Spiegare che negli alveoli l'ossigeno passa nel sangue e l'anidride carbonica ne esce
