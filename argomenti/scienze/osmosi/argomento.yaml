titolo: L'osmosi
sottotitolo: Come l'acqua attraversa una membrana, dal recipiente alla cellula
materia: scienze
area: biologia
modello: passaggi
durata_minuti: 15
prerequisiti: [stati-della-materia]
obiettivi:
  - Riconoscere in una soluzione il solvente e il soluto
  - Spiegare che cos'è una membrana semipermeabile
  - Descrivere l'osmosi come il passaggio dell'acqua verso il lato con più soluto
  - Prevedere che cosa succede a una cellula in acqua pura e in acqua molto zuccherata
