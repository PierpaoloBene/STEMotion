# Le materie del sito. `ordine` decide la posizione nella landing.
# `aree` sono le sottomaterie: raggruppano gli argomenti nella pagina della materia
# (campo `area` di argomento.yaml), nell'ordine in cui sono scritte qui.
- id: scienze
  ordine: 1
  nome: Scienze
  descrizione: Il corpo umano, i viventi, le forze e le trasformazioni della materia.
  aree:
    - { id: biologia, nome: Biologia }
    - { id: anatomia, nome: Anatomia }
    - { id: fisica, nome: Fisica }
    - { id: chimica-organica, nome: Chimica organica }
    - { id: chimica-inorganica, nome: Chimica inorganica }

- id: matematica
  ordine: 2
  nome: Matematica
  descrizione: Numeri, figure e relazioni, da vedere e da muovere.
  aree:
    - { id: aritmetica, nome: Aritmetica }
    - { id: geometria, nome: Geometria }
    - { id: algebra, nome: Algebra }
