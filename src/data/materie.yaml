# Le materie del sito. `ordine` decide la posizione nella landing.
# `aree` raggruppa gli argomenti nella pagina della materia (campo `area` di argomento.yaml).
- id: scienze
  ordine: 1
  nome: Scienze
  descrizione: Il corpo umano, i viventi, la materia e le sue trasformazioni.
  aree:
    - { id: anatomia, nome: Corpo umano }
    - { id: biologia, nome: Biologia }
    - { id: chimica, nome: Chimica }
    - { id: scienze-della-terra, nome: Scienze della Terra }

- id: matematica
  ordine: 2
  nome: Matematica
  descrizione: Numeri, figure e relazioni, da vedere e da muovere.
  aree:
    - { id: aritmetica, nome: Aritmetica }
    - { id: geometria, nome: Geometria }
    - { id: relazioni-funzioni, nome: Relazioni e funzioni }

- id: fisica
  ordine: 3
  nome: Fisica
  descrizione: Forze, movimento ed energia, per capire come funziona il mondo.
  aree:
    - { id: meccanica, nome: Forze e movimento }
    - { id: energia, nome: Energia e calore }
    - { id: luce-suono, nome: Luce e suono }
